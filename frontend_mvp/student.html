<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juwi — Student Portal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
    /* Locked state */
    .locked-overlay {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 60vh; text-align: center; gap: 24px;
    }
    .lock-icon { font-size: 3.5rem; color: var(--text-3); }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      background: var(--surface-2);
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(193,123,92,.05);
    }
    .upload-zone .upload-icon { font-size: 2rem; margin-bottom: 12px; color: var(--text-3); }
    .upload-zone p { font-size: .875rem; color: var(--text-3); }

    /* Results */
    .results-hero {
      border-radius: var(--radius-lg);
      padding: 52px 40px;
      text-align: center;
      color: white;
      position: relative; overflow: hidden;
    }
    .results-hero::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(0,0,0,.25);
    }
    .results-hero > * { position: relative; z-index: 1; }
    .results-hero .trophy { font-size: 3.5rem; margin-bottom: 16px; display: block; color: rgba(255,255,255,.9); }
    .results-hero h1 { color: white; font-size: clamp(1.5rem,3vw,2.5rem); }
    .results-hero p  { color: rgba(255,255,255,.8); font-size: 1.1rem; margin-top: 10px; }
    .results-hero .rank-badge {
      display: inline-block; margin-top: 20px;
      background: rgba(255,255,255,.2);
      border: 2px solid rgba(255,255,255,.4);
      border-radius: 99px; padding: 8px 28px;
      font-size: 1.1rem; font-weight: 700;
    }

    .feedback-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap: 20px; margin-top: 24px; }
    .feedback-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 24px;
    }
    .feedback-card h4 { margin-bottom: 12px; }
    .feedback-content { font-size: .875rem; line-height: 1.75; color: var(--text-2); white-space: pre-line; }

    /* Step indicator */
    .step-bar { display: flex; gap: 8px; margin-bottom: 32px; }
    .step { flex: 1; height: 4px; border-radius: 99px; background: var(--border); }
    .step.done  { background: var(--accent); }
    .step.active { background: var(--accent-3); }
    @keyframes popIn {
      0%   { transform: scale(0.6); opacity:0; }
      70%  { transform: scale(1.12); }
      100% { transform: scale(1); opacity:1; }
    }
    .pop-in { animation: popIn .5s cubic-bezier(.4,0,.2,1) forwards; }

    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .shimmer-text {
      background: linear-gradient(90deg, #D4A853 0%, #fff 40%, #D4A853 60%, #C17B5C 100%);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 2.5s linear infinite;
    }

    .submit-success {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 48px 32px;
      text-align: center;
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-brand" style="text-decoration:none;">
    <div class="dot-logo">J</div>
    Juwi<span>.</span>
  </a>
  <div class="nav-links">
    <span id="statusBadge" class="badge badge-neutral">Submission Open</span>
  </div>
</nav>

<div class="page-wrap" id="mainWrap">
  <!-- Filled dynamically by student.js -->
</div>

<div id="toast-container"></div>
<script src="student.js"></script>
</body>
</html>
